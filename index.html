<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portfolio | Dzyemitri Dzikri Ramadhan</title>
  
  <!-- Favicon / Web App Icon -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1tTZct2jlSpJYyF9IebWWhJT_vH8c4zYW">
  <link rel="shortcut icon" href="https://lh3.googleusercontent.com/d/1tTZct2jlSpJYyF9IebWWhJT_vH8c4zYW">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1tTZct2jlSpJYyF9IebWWhJT_vH8c4zYW">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ececec; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- URL Executable Google Apps Script Web App Anda -->
  <iframe id="gasFrame" src="" allow="clipboard-write"></iframe>

  <script>
    // Konversi parameter ?p=admin atau #admin menjadi parameter query ?p=admin untuk Google Apps Script
    (function() {
      var baseGasUrl = "https://script.google.com/macros/s/AKfycbzdR5A5a--Fjt-OeqeH7sa8wLx9drDNF-o_WZy9OkeEdGO-kQX07mKcZ7NvdDJTH118HA/exec";
      
      function getIframeTargetUrl() {
        var hash = (window.location.hash || '').toLowerCase();
        var search = (window.location.search || '').toLowerCase();
        var isAdmin = (hash === '#admin' || hash.indexOf('admin') !== -1 || search.indexOf('admin') !== -1);
        return isAdmin ? (baseGasUrl + "?p=admin") : baseGasUrl;
      }

      var iframe = document.getElementById('gasFrame');
      iframe.src = getIframeTargetUrl();

      // Dengarkan jika hash berubah saat halaman sedang terbuka
      window.addEventListener('hashchange', function() {
        var newTarget = getIframeTargetUrl();
        if (iframe.src !== newTarget) {
          iframe.src = newTarget;
        }
      });
    })();
  </script>
</body>
</html>
